site_name: OpenShift MCP Server
site_description: Kubernetes and OpenShift MCP server — build, configure, and run with Cursor
site_author: OpenShift MCP Community
repo_url: https://github.com/openshift/openshift-mcp-server
repo_name: openshift-mcp-server
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - header.autohide

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - MCP Server:
    - Overview: mcp-server/index.md
    - Build from Source: mcp-server/build-from-source.md
    - Installation: mcp-server/installation.md
    - Cursor Integration: mcp-server/cursor-integration.md
    - Configuration: mcp-server/configuration.md
    - Toolsets: reference/toolsets.md
    - FAQ: reference/faq.md
  - SRE Agent:
    - Overview: sre-agent/index.md
    - Quick Start: getting-started/quickstart.md
    - Prompt Examples: sre-agent/prompt-examples.md
    - Setup Guide: getting-started/sre-agent.md
    - Cursor Integration: getting-started/cursor-integration.md
    - Workflows:
      - Cluster Health: workflows/cluster-health.md
      - Troubleshooting: workflows/troubleshooting.md
      - Security & Compliance: workflows/security-compliance.md
      - Performance Tuning: workflows/performance-tuning.md
      - Disaster Recovery: workflows/disaster-recovery.md
      - Observability: workflows/observability.md
      - Incident Response: workflows/incident-response.md
    - Advanced:
      - Must-Gather Analysis: advanced/must-gather.md
      - Multi-Cluster: advanced/multi-cluster.md
      - Custom Toolsets: advanced/custom-toolsets.md
      - Security: advanced/security.md
      - API Reference: advanced/api-reference.md
    - Reference:
      - SRE Tools Analysis: reference/sre-tools-analysis.md
      - Configuration Reference: reference/configuration.md
      - Troubleshooting: reference/troubleshooting.md
