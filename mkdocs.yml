site_name: OpenShift MCP Server - SRE Edition
site_description: AI-Powered OpenShift Operations for Site Reliability Engineers
site_author: OpenShift MCP Community
repo_url: https://github.com/openshift/openshift-mcp-server
repo_name: openshift-mcp-server
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - header.autohide

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Cursor Integration: getting-started/cursor-integration.md
  - SRE Workflows:
    - Cluster Health Monitoring: workflows/cluster-health.md
    - Troubleshooting & Debugging: workflows/troubleshooting.md
    - Security & Compliance: workflows/security-compliance.md
    - Performance Tuning: workflows/performance-tuning.md
    - Disaster Recovery: workflows/disaster-recovery.md
    - Observability Setup: workflows/observability.md
    - Incident Response: workflows/incident-response.md
  - Advanced Topics:
    - Multi-Cluster Management: advanced/multi-cluster.md
    - Custom Toolsets: advanced/custom-toolsets.md
    - API Reference: advanced/api-reference.md
    - Security Best Practices: advanced/security.md
    - Must-Gather Analysis: advanced/must-gather.md
  - Reference:
    - Toolsets Guide: reference/toolsets.md
    - Configuration Reference: reference/configuration.md
    - Troubleshooting: reference/troubleshooting.md
    - FAQ: reference/faq.md
